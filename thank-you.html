<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You - Nexa Fitness</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #0a0a0f;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
  }
  .card {
    background: #1a1a2e;
    padding: 40px 30px;
    border-radius: 16px;
    max-width: 400px;
    width: 90%;
  }
  h1 {
    color: #ff7a00;
    font-size: 2.5rem;
    margin-bottom: 10px;
  }
  p {
    color: #ccc;
    font-size: 1.1rem;
    margin-bottom: 30px;
  }
  .btn {
    display: inline-block;
    background: #fff;
    color: #ff7a00;
    padding: 12px 30px;
    border-radius: 50px;
    text-decoration: none;
    font-weight: bold;
    font-size: 1rem;
    transition: 0.2s;
  }
  .btn:hover {
    background: #ff7a00;
    color: #fff;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Thanks!</h1>
    <p>Your message has been sent. We'll get back to you soon.</p>
