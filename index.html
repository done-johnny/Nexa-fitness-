   <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexa Fitness</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Hero Section -->
    <section id="home">
        <h1>Nexa Fitness</h1>
        <p>Transform your body, elevate your life</p>
        <a href="#plans" class="btn view-plans">View Plans</a>
    </section>

    <!-- Plans Section -->
    <section id="plans">
        <h2>Our Plans</h2>
        <div class="card">
            <h3>Monthly Plan</h3>
            <p class="price">$79/mo</p>
            <ul>
                <li>24/7 Gym Access</li>
                <li>Personal Training Session</li>
                <li>Nutrition Guide</li>
            </ul>
            <a href="#contact" class="btn choose-plan">Choose Plan</a>
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact">
        <h2>Contact Us</h2>
        <form>
            <input type="text" placeholder="Name" required>
            <input type="email" placeholder="Email" required>
            <input type="tel" placeholder="Phone" required>
            <button type="submit">Submit</button>
        </form>
    </section>
</body>
</html>
