<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexa Fitness</title>
    <link rel="stylesheet" href="style.css">
</head>
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff4500">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="icon-192.png">
<body>

    <!-- Hero Section -->
    <section id="home">
        <h1>Nexa Fitness</h1>
        <p>Transform your body, elevate your life</p>
        <a href="#plans" class="btn">View Plans</a>
    </section>

    <!-- Plans Section -->
    <section id="plans">
        <h2>Our Plans</h2>
        <div class="card">
            <h3>Monthly Plan</h3>
            <p class="price">$79/mo</p>
            <ul>
                <li>24/7 Gym Access</li>
                <li>Personal Training Session</li>
                <li>Nutrition Guide</li>
            </ul>
            <a href="#contact" class="btn">Choose Plan</a>
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact">
        <h2>Contact Us</h2>
    <form action="https://formspree.io/f/mnjrppwe" method="POST">
    <input type="hidden" name="_next" value="https://done-johnny.github.io/done-johnny.github.io-Nexa-fitness-/thank-you.html">
    <input type="text" name="name" placeholder="Enter your name" required>
    <input type="email" name="email" placeholder="Enter your email" required>
    <input type="tel" name="phone" placeholder="Enter your phone" required>
    <button type="submit">Submit</button>
</form>
    </section>

<script>
document.querySelector('form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const form = e.target;
    const data = new FormData(form);
    try {
        const res = await fetch(form.action, {
            method: 'POST',
            body: data,
            headers: { 'Accept': 'application/json' }
        });
        if (res.ok) {
            window.location.href = 'https://done-johnny.github.io/done-johnny.github.io-Nexa-fitness-/thank-you.html';
        } else {
            alert('Something went wrong. Please try again.');
        }
    } catch (error) {
        alert('Network error. Please try again.');
    }
});
</script>
</body>
</html>
